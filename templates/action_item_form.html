{% extends "base.html" %}

{% block title %}{{ 'Edit Action Item' if item else 'New Action Item' }}{% endblock %}

{% block content %}
<h3>{{ 'Edit Action Item' if item else 'New Action Item' }}</h3>

<form method="POST" class="mt-3" style="max-width: 650px;">
    {% if item %}
        <div class="mb-3">
            <label class="form-label">Project</label>
            <input type="text" class="form-control" value="{{ item.project_name }}" disabled>
        </div>
    {% else %}
        <div class="mb-3">
            <label class="form-label">Project</label>
            <select name="project_id" class="form-select" required>
                {% for p in projects %}
                    <option value="{{ p.id }}">{{ p.name }}</option>
                {% endfor %}
            </select>
        </div>
    {% endif %}

    <div class="mb-3">
        <label class="form-label">Week Number</label>
        <input type="number" name="week_number" class="form-control" min="1" max="52" required
               value="{{ item.week_number if item else 1 }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Action Item</label>
        <input type="text" name="description" class="form-control" required
               placeholder="e.g. Create database"
               value="{{ item.description if item else '' }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Assign To</label>
        <select name="assigned_to" class="form-select">
            <option value="">Unassigned</option>
            {% for u in users %}
                <option value="{{ u.id }}" {% if item and item.assigned_to == u.id %}selected{% endif %}>{{ u.full_name }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Status</label>
        <select name="status" class="form-select">
            {% for s in statuses %}
                <option value="{{ s }}" {% if item and item.status == s %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
        </select>
    </div>

    <button type="submit" class="btn btn-success">Save Action Item</button>
    <a href="{{ url_for('action_items') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
