{% extends "base.html" %}

{% block title %}{{ 'Edit Task' if task else 'New Task' }}{% endblock %}

{% block content %}
<h3>{{ 'Edit Task' if task else 'New Task' }}</h3>

<form method="POST" class="mt-3" style="max-width: 650px;">
    {% if task %}
        <div class="mb-3">
            <label class="form-label">User Story</label>
            <input type="text" class="form-control" value="US-{{ task.story_id }} | {{ task.story_title }}" disabled>
        </div>
    {% else %}
        <div class="mb-3">
            <label class="form-label">User Story</label>
            <select name="story_id" class="form-select" required>
                {% for s in stories %}
                    <option value="{{ s.id }}">US-{{ s.id }} | {{ s.title }} ({{ s.project_name }})</option>
                {% endfor %}
            </select>
        </div>
    {% endif %}

    <div class="mb-3">
        <label class="form-label">Task Title</label>
        <input type="text" name="title" class="form-control" required
               placeholder="e.g. Design login page"
               value="{{ task.title if task else '' }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Assign To</label>
        <select name="assigned_to" class="form-select">
            <option value="">Unassigned</option>
            {% for u in users %}
                <option value="{{ u.id }}" {% if task and task.assigned_to == u.id %}selected{% endif %}>{{ u.full_name }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Priority</label>
            <select name="priority" class="form-select">
                {% for p in priorities %}
                    <option value="{{ p }}" {% if task and task.priority == p %}selected{% elif not task and p == 'Medium' %}selected{% endif %}>{{ p }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Status</label>
            <select name="status" class="form-select">
                {% for s in statuses %}
                    <option value="{{ s }}" {% if task and task.status == s %}selected{% endif %}>{{ s }}</option>
                {% endfor %}
            </select>
        </div>
    </div>

    <button type="submit" class="btn btn-success">Save Task</button>
    <a href="{{ url_for('tasks') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
